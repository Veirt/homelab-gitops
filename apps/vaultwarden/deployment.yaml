---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
spec:
  replicas: 1
  # Single-replica SQLite on an RWX NFS volume: a surge pod would open the same
  # db.sqlite3 concurrently, so replace the pod instead of rolling both.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.4-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 192Mi
          volumeMounts:
            - name: data-volume
              mountPath: /data
              subPath: vaultwarden
      volumes:
        - name: data-volume
          persistentVolumeClaim:
            claimName: data-pvc
