---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        # Containerd's stacked cri-containerd AppArmor profile denies
        # intra-container signals, which breaks .NET GC thread suspension
        # (rtmin+2/rtmin+3) and aborts the process. See:
        # https://github.com/dotnet/runtime/issues/136603
        appArmorProfile:
          type: Unconfined
      nodeSelector:
        kubernetes.io/hostname: althea
      containers:
        - name: jellyfin
          image: lscr.io/linuxserver/jellyfin:10.11.11
          env:
            - name: MALLOC_TRIM_THRESHOLD_
              value: "131072"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Makassar"
          ports:
            - containerPort: 8096
          # Jellyfin reports /health as HTTP 200 even while the startup check
          # is Degraded, so gate readiness on the response body instead.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - curl -fsS http://127.0.0.1:8096/health | grep -qx Healthy
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 768Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: jellyfin-volume
              mountPath: /config
              subPath: jellyfin/config
            - name: jellyfin-volume
              mountPath: /cache
              subPath: jellyfin/cache
            - name: media-volume
              mountPath: /media/anime
              subPath: media/anime
            - name: media-volume
              mountPath: /media/courses
              subPath: media/courses
            - name: media-volume
              mountPath: /media/movies
              subPath: media/movies
            - name: media2-volume
              mountPath: /media/sonarr
              subPath: media/sonarr
            - name: media2-volume
              mountPath: /media/western
              subPath: media/western
      volumes:
        - name: jellyfin-volume
          persistentVolumeClaim:
            claimName: data-pvc
        - name: media-volume
          persistentVolumeClaim:
            claimName: media-pvc
        - name: media2-volume
          persistentVolumeClaim:
            claimName: storage3-pvc
