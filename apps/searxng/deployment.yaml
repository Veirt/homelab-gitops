---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
        - name: searxng
          image: ghcr.io/searxng/searxng:2026.6.24-e3126b89e
          env:
            - name: PYTHONPATH
              value: /etc/searxng
            - name: SERPAPI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: searxng-serpapi
                  key: api-key
                  optional: true
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/searxng
              subPath: searxng
      volumes:
        - name: config-volume
          persistentVolumeClaim:
            claimName: data-pvc
