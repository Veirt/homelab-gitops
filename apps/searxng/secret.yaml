---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: searxng-serpapi
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: searxng-serpapi
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-key
      remoteRef:
        key: secret/searxng
        property: serpapi_api_key
