---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage2-pv
spec:
  capacity:
    storage: 60Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /storage2
    server: 192.168.1.6
  mountOptions:
    - vers=4.2
    - noatime
    - nodiratime
    - hard
    - tcp
    - rsize=524288
    - wsize=524288
    - actimeo=60
    - lookupcache=positive
