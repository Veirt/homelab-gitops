---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: storage3-pv
spec:
  capacity:
    storage: 298Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: /storage3
    server: 192.168.1.6
  mountOptions:
    - vers=4.2
    - noatime
    - nodiratime
    - hard
    - tcp
