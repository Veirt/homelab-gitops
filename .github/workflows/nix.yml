name: Nix CI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Nix formatting
        run: |
          nix shell "github:NixOS/nixpkgs/c56a87d8e41ce69bd2af57eb35dcc117a9dfca33#nixfmt" \
            -c bash -c 'find modules -name "*.nix" -print0 | xargs -0 nixfmt --check'
